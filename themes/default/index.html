<h1>{{ site.title | html.escape }}</h1>
<ul class="articles">
{{ for item in articles }}
  <li>
    <a href="/{{ item.slug | html.escape }}">{{ item.title | html.escape }}</a>
    {{ if item.date }}<div class="date">{{ item.date | html.escape }}</div>{{ end }}
    {{ if item.description }}<p>{{ item.description | html.escape }}</p>{{ end }}
  </li>
{{ end }}
</ul>
