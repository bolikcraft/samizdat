<article>
<h1>{{ article.title | html.escape }}</h1>
{{ if article.date }}<p class="date">{{ article.date | html.escape }}</p>{{ end }}
{{ article.html }}
</article>
{{ if user }}
<details class="share">
  <summary>Поделиться</summary>
  <form method="post" action="/share" class="share-form">
    {{ antiforgery }}
    <input type="hidden" name="slug" value="{{ article.slug | html.escape }}">
    <label>Срок
      <select name="days">
        <option value="1">День</option>
        <option value="7" selected>Неделя</option>
        <option value="30">Месяц</option>
        <option value="365">Год</option>
        <option value="0">Без срока</option>
      </select>
    </label>
    <label>Кому <input type="text" name="note" maxlength="200" autocomplete="off"></label>
    <button type="submit">Создать ссылку</button>
  </form>
</details>
{{ end }}
