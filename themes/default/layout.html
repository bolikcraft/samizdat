<!doctype html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page_title | html.escape }}</title>
{{ if description }}<meta name="description" content="{{ description | html.escape }}">{{ end }}
<link rel="stylesheet" href="/assets/style.css"></head>
<body>
<header class="top"><a href="/">{{ site.title | html.escape }}</a></header>
{{ if nav }}
<div class="shell">
  <aside class="sidebar">
    <details open>
      <summary>Статьи</summary>
      <div class="sidebar-body">
        <input type="search" id="nav-filter" placeholder="Фильтр по заголовку" autocomplete="off">
        <nav id="nav-tree">{{ include 'nav-node' node: nav }}</nav>
      </div>
    </details>
  </aside>
  <main>{{ content }}</main>
</div>
{{ else }}
<main>{{ content }}</main>
{{ end }}
<footer class="bottom">Samizdat</footer>
<script src="/assets/sidebar.js" defer></script>
</body></html>
