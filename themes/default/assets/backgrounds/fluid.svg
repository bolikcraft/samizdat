<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="depth" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#160b2e"/>
      <stop offset="1" stop-color="#2a1140"/>
    </linearGradient>
    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffc247"/>
      <stop offset="0.45" stop-color="#ff5f6d"/>
      <stop offset="1" stop-color="#ff3d81" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe0ff"/>
      <stop offset="0.5" stop-color="#3a6dff"/>
      <stop offset="1" stop-color="#3a6dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e879ff"/>
      <stop offset="0.5" stop-color="#a742f5"/>
      <stop offset="1" stop-color="#a742f5" stop-opacity="0"/>
    </radialGradient>
    <filter id="melt" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#depth)"/>
  <!-- Пятна перекрываются, и одно размытие на всю группу сплавляет их в одно течение. -->
  <g filter="url(#melt)">
    <ellipse cx="620" cy="520" rx="640" ry="470" fill="url(#blobA)"/>
    <ellipse cx="1120" cy="360" rx="620" ry="450" fill="url(#blobB)" opacity="0.95"/>
    <ellipse cx="900" cy="760" rx="560" ry="380" fill="url(#blobC)" opacity="0.9"/>
    <ellipse cx="180" cy="180" rx="420" ry="300" fill="url(#blobC)" opacity="0.55"/>
  </g>
</svg>
