<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cold" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#05121f"/>
      <stop offset="1" stop-color="#0b2340"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#1f6feb"/>
      <stop offset="1" stop-color="#22d3c5"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#7b5cf5"/>
      <stop offset="1" stop-color="#2f9bff"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#f05b8f"/>
      <stop offset="1" stop-color="#8b4bf0"/>
    </linearGradient>
    <filter id="haze" x="-20%" y="-30%" width="140%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#cold)"/>
  <!-- Слои идут снизу вверх и перекрываются полупрозрачно: получается глубина, а не полосы. -->
  <g filter="url(#haze)">
    <path d="M-100 600 C 300 430 700 660 1100 470 C 1350 350 1550 400 1750 330 L1750 1000 L-100 1000 Z"
          fill="url(#w3)" opacity="0.55"/>
    <path d="M-100 700 C 350 540 680 760 1080 590 C 1360 470 1540 520 1750 460 L1750 1000 L-100 1000 Z"
          fill="url(#w2)" opacity="0.6"/>
    <path d="M-100 810 C 320 660 720 870 1120 700 C 1380 590 1560 640 1750 590 L1750 1000 L-100 1000 Z"
          fill="url(#w1)" opacity="0.75"/>
  </g>
</svg>
