<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="polar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060b1c"/>
      <stop offset="0.6" stop-color="#0d1f34"/>
      <stop offset="1" stop-color="#15384a"/>
    </linearGradient>
    <linearGradient id="band1" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#3ee0a1" stop-opacity="0.2"/>
      <stop offset="0.45" stop-color="#3ee0a1" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#7a6cf0" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="-0.2">
      <stop offset="0" stop-color="#6ad7ff" stop-opacity="0.15"/>
      <stop offset="0.45" stop-color="#6ad7ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#c86ce8" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#polar)"/>
  <g fill="#fff">
    <circle cx="180" cy="120" r="1.8" opacity="0.7"/>
    <circle cx="420" cy="70" r="1.2" opacity="0.5"/>
    <circle cx="760" cy="150" r="1.6" opacity="0.6"/>
    <circle cx="1080" cy="80" r="1.2" opacity="0.45"/>
    <circle cx="1380" cy="180" r="1.8" opacity="0.6"/>
    <circle cx="1520" cy="60" r="1.1" opacity="0.4"/>
  </g>
  <g filter="url(#soft)">
    <path d="M-100 420 Q 300 250 700 400 T 1700 330 L1700 520 Q 1200 620 700 540 T -100 600 Z" fill="url(#band1)"/>
    <path d="M-100 560 Q 400 430 900 560 T 1700 500 L1700 660 Q 1100 760 600 690 T -100 720 Z" fill="url(#band2)"/>
  </g>
</svg>
