services:
  db:
    # Не alpine: в musl текст сортируется по кодам символов, русские названия встают не по алфавиту.
    # Мажорную версию и вариант образа менять только через dump и restore: файлы pgdata между ними несовместимы.
    image: postgres:17
    environment:
      POSTGRES_DB: samizdat
      POSTGRES_USER: samizdat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Папки, а не именованные тома: docker compose down -v их не удаляет.
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Через TCP: при первом старте временный сервер инициализации слушает только сокет, и проверка прошла бы раньше времени.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samizdat -d samizdat"]
      interval: 5s
      retries: 20
    # Без cap_drop: entrypoint образа стартует от root и сам переходит на пользователя postgres.
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  app:
    build: .
    image: samizdat:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Без GSS Npgsql ищет libgssapi_krb5, которой нет в chiseled-образе, и пишет ошибку в лог.
      # Роль без прав суперпользователя, её создаёт deploy/update.sh. POSTGRES_PASSWORD сюда не идёт.
      ConnectionStrings__Postgres: Host=db;Database=samizdat;Username=samizdat_app;Password=${SAMIZDAT_DB_PASSWORD:?run deploy/update.sh};GSS Encryption Mode=Disable
      Samizdat__Auth__AttemptsPerMinute: ${SAMIZDAT_LOGIN_ATTEMPTS:-10}
      Samizdat__Proxy: ${SAMIZDAT_PROXY:-}
    volumes:
      - ./data:/data
    # Docker пишет свои правила iptables в обход ufw: порт на 0.0.0.0 открыт всей сети.
    ports:
      - "${SAMIZDAT_BIND:-127.0.0.1}:${SAMIZDAT_PORT:-8080}:8080"
    # Запись только в /data и /tmp. В /tmp ASP.NET Core кладёт формы больше 64 КБ.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
