services:
  db:
    # Не alpine: в musl текст сортируется по кодам символов, русские названия встают не по алфавиту.
    # Мажорную версию и вариант образа менять только через dump и restore: файлы pgdata между ними несовместимы.
    image: postgres:17
    environment:
      POSTGRES_DB: samizdat
      POSTGRES_USER: samizdat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    # Папки, а не именованные тома: docker compose down -v их не удаляет.
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    # Через TCP: при первом старте временный сервер инициализации слушает только сокет, и проверка прошла бы раньше времени.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U samizdat -d samizdat"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    image: samizdat:local
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Без GSS Npgsql ищет libgssapi_krb5, которой нет в chiseled-образе, и пишет ошибку в лог.
      ConnectionStrings__Postgres: Host=db;Database=samizdat;Username=samizdat;Password=${POSTGRES_PASSWORD};GSS Encryption Mode=Disable
    volumes:
      - ./data:/data
    ports:
      - "${SAMIZDAT_BIND:-0.0.0.0}:${SAMIZDAT_PORT:-8080}:8080"
    restart: unless-stopped
